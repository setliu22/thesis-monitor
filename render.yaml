services:
  - type: web
    name: thesis-monitor
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    preDeployCommand: alembic upgrade head
    healthCheckPath: /ready
    envVars:
      - key: PRODUCTION
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: thesis-monitor-db
          property: connectionString
      - key: SEC_USER_AGENT
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ALERT_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        generateValue: true
  - type: worker
    name: thesis-sync
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.worker
    envVars:
      - key: PRODUCTION
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: thesis-monitor-db
          property: connectionString
      - key: SEC_USER_AGENT
        fromService:
          name: thesis-monitor
          type: web
          envVarKey: SEC_USER_AGENT
      - key: APP_ORIGIN
        fromService:
          name: thesis-monitor
          type: web
          envVarKey: APP_ORIGIN
      - key: RESEND_API_KEY
        fromService:
          name: thesis-monitor
          type: web
          envVarKey: RESEND_API_KEY
      - key: EMAIL_FROM
        fromService:
          name: thesis-monitor
          type: web
          envVarKey: EMAIL_FROM
      - key: ALERT_EMAIL
        fromService:
          name: thesis-monitor
          type: web
          envVarKey: ALERT_EMAIL
  - type: worker
    name: thesis-email
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.notifications
    envVars:
      - key: PRODUCTION
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: thesis-monitor-db
          property: connectionString
      - key: SEC_USER_AGENT
        fromService:
          name: thesis-monitor
          type: web
          envVarKey: SEC_USER_AGENT
      - key: APP_ORIGIN
        fromService:
          name: thesis-monitor
          type: web
          envVarKey: APP_ORIGIN
      - key: RESEND_API_KEY
        fromService:
          name: thesis-monitor
          type: web
          envVarKey: RESEND_API_KEY
      - key: EMAIL_FROM
        fromService:
          name: thesis-monitor
          type: web
          envVarKey: EMAIL_FROM
      - key: ALERT_EMAIL
        fromService:
          name: thesis-monitor
          type: web
          envVarKey: ALERT_EMAIL

databases:
  - name: thesis-monitor-db
    plan: 0.1c-256mb
    diskSizeGB: 5
    ipAllowList: []
