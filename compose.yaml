services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: thesis
      POSTGRES_PASSWORD: thesis
      POSTGRES_DB: thesis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U thesis -d thesis']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://thesis:thesis@db:5432/thesis
    command: ['alembic', 'upgrade', 'head']
    depends_on:
      db:
        condition: service_healthy
  api:
    restart: unless-stopped
    build: ./backend
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://thesis:thesis@db:5432/thesis
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      REFRESH_SECONDS: ${REFRESH_SECONDS:-3600}
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    restart: unless-stopped
    build: ./backend
    environment: *app_env
    command: ['python', '-m', 'app.worker']
    depends_on:
      migrate:
        condition: service_completed_successfully
  notifier:
    build: ./backend
    restart: unless-stopped
    environment: *app_env
    command: ['python', '-m', 'app.notifications']
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build: ./frontend
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - api
volumes:
  postgres_data:
